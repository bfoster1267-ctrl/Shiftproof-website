<!doctype html>
<!-- Generator for the 1200x630 social card. Rendered headless at exactly
     1200x630; see tools/README-og.md for the command. Kept in the repo so the
     card can be regenerated when the wordmark, claim or domain changes. -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  .card{width:1200px;height:630px;display:flex;align-items:center;
        background:radial-gradient(120% 140% at 18% 0%, #1b3a7a 0%, #0d1b3a 46%, #091426 100%);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;position:relative}
  .left{padding:0 96px;width:100%;text-align:center}
  .eyebrow{font-size:20px;font-weight:700;letter-spacing:.16em;color:#5C8DFF;margin:0 0 22px}
  h1{font-size:64px;line-height:1.06;letter-spacing:-.02em;color:#fff;margin:0 0 24px;font-weight:800}
  p{font-size:23px;line-height:1.42;color:#b9c8e6;margin:0 0 30px}
  .pill{display:inline-block;padding:15px 32px;border-radius:999px;border:1px solid #5C8DFF;
        color:#fff;font-size:20px;font-weight:700}
  .phone{position:absolute;right:64px;top:64px;width:330px;height:640px;border-radius:44px;
         border:11px solid #10182b;overflow:hidden;background:#f2f4f8;
         box-shadow:0 30px 70px rgba(0,0,0,.45)}
  .phone img{width:100%;display:block}
</style></head><body>
<div class="card">
  <div class="left">
    <p class="eyebrow">WAGETALLY · IRELAND BETA</p>
    <h1>Expected pay for the shifts you actually worked.</h1>
    <p>Built around HSE pay. We're looking for nurses and midwives to test it.</p>
    <span class="pill">Now recruiting testers</span>
  </div>
  <!-- No device shot until the screenshots are re-captured from a WageTally
       build: the current ones carry the old wordmark in the template AND in
       the app UI inside them, so embedding one would ship mixed branding. -->
</div>
</body></html>
