<!doctype html>
<!-- Generator for the 1200x630 social cards. Rendered headless at exactly
     1200x630; see tools/README-og.md for the commands. Kept in the repo so the
     cards can be regenerated when the wordmark, claim or domain changes.

     Two cards from one file, chosen with ?card=home or ?card=ie:
       home — every page except the Ireland beta. Text only, deliberately: the
              only device shots that are brand-clean and general are the US set,
              and putting a dollar figure on the card for a site whose current
              push is Ireland reads as a mismatch.
       ie   — the Ireland beta page, and the card that actually gets shared in
              outreach. It carries a real device shot, because a nurse who has
              never heard of WageTally is deciding in one glance whether this is
              a working app or a landing page.

     The device shot is windowed out of the shipped composite with the same
     percentages styles.css uses, so no extra asset has to be committed and the
     phone can never drift from what the site shows. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
  .card{width:1200px;height:630px;display:flex;align-items:center;
        background:radial-gradient(120% 140% at 18% 0%, #1b3a7a 0%, #0d1b3a 46%, #091426 100%);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;position:relative}
  .left{padding:0 96px;width:100%;text-align:center}
  .eyebrow{font-size:20px;font-weight:700;letter-spacing:.16em;color:#5C8DFF;margin:0 0 22px}
  h1{font-size:64px;line-height:1.06;letter-spacing:-.02em;color:#fff;margin:0 0 24px;font-weight:800}
  p{font-size:23px;line-height:1.42;color:#b9c8e6;margin:0 0 30px}
  .pill{display:inline-block;padding:15px 32px;border-radius:999px;border:1px solid #5C8DFF;
        color:#fff;font-size:20px;font-weight:700}

  /* Two-column variant, used when a device shot is present. */
  body.has-phone .left{width:auto;max-width:660px;text-align:left;padding:0 0 0 84px}
  body.has-phone h1{font-size:54px}
  body.has-phone p{font-size:21px;margin-bottom:26px}

  .phone{position:absolute;right:86px;top:78px;width:296px;
         aspect-ratio:758 / 1611;border-radius:40px;overflow:hidden;
         background:#0b0d11;border:9px solid #10182b;
         box-shadow:0 30px 70px rgba(0,0,0,.5)}
  /* Same window styles.css performs: the composite is 1290 wide and the device
     box inside it is 758 x 1611 at x 266, y 980. */
  .phone img{position:absolute;width:170.185%;left:-35.092%;top:-60.832%;max-width:none}
</style></head><body>
<div class="card">
  <div class="left">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="headline"></h1>
    <p id="sub"></p>
    <span class="pill" id="pill"></span>
  </div>
  <div class="phone" id="phone" hidden>
    <img src="../assets/web/WageTallyIE-02-BuiltAroundHSEPay.jpg" alt="">
  </div>
</div>
<script>
  var CARDS = {
    home: {
      eyebrow: 'WAGETALLY',
      headline: 'Know what your shifts should pay.',
      sub: 'Record the shifts you actually worked, see every premium that applies, then hold the total against your payslip.',
      // No pill. "On the App Store" would send people to a listing still named
      // ShiftProof Pay Tracker, and a pricing claim is not worth the risk here.
      pill: '',
      phone: false
    },
    ie: {
      eyebrow: 'WAGETALLY · IRELAND BETA',
      headline: 'Expected pay for the shifts you actually worked.',
      sub: "Built around HSE pay. We're looking for nurses and midwives to test it against their real payslips.",
      pill: 'Now recruiting testers',
      phone: true
    }
  };
  var key = new URLSearchParams(location.search).get('card') || 'home';
  var c = CARDS[key] || CARDS.home;
  document.getElementById('eyebrow').textContent = c.eyebrow;
  document.getElementById('headline').textContent = c.headline;
  document.getElementById('sub').textContent = c.sub;
  var pill = document.getElementById('pill');
  if (c.pill) { pill.textContent = c.pill; } else { pill.remove(); }
  if (c.phone) {
    document.body.classList.add('has-phone');
    document.getElementById('phone').hidden = false;
  }
</script>
</body></html>
